<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodiva — Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-dark text-light">
  <main class="container-fluid py-3">
    <a href="index.html" class="btn btn-sm btn-outline-light mb-3">← Projects</a>
    <h2 id="title">Loading…</h2>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
      <button id="modeDraw" class="btn btn-primary btn-sm">Draw wall</button>
      <button id="modeEdit" class="btn btn-outline-warning btn-sm">Edit</button>
      <button id="deleteSelected" class="btn btn-danger btn-sm" disabled>Delete</button>
      <button id="undoBtn" class="btn btn-outline-secondary btn-sm" disabled>↶ Undo</button>
      <button id="redoBtn" class="btn btn-outline-secondary btn-sm" disabled>↷ Redo</button>
      <button id="modeSelect" class="btn btn-outline-light btn-sm">Select / move</button>
      <button id="modeDoor" class="btn btn-outline-info btn-sm">+ Door</button>
      <button id="modeWindow" class="btn btn-outline-info btn-sm">+ Window</button>
      <span class="text-muted small">Shift+drag or middle-drag to pan · wheel to zoom · Delete removes selected · Esc cancels · Ctrl+Z / Ctrl+Y undo/redo · click a wall to place a door/window</span>
      <span class="ms-auto d-flex gap-2 align-items-center">
        <button id="zoomIn" class="btn btn-outline-light btn-sm">+</button>
        <button id="zoomOut" class="btn btn-outline-light btn-sm">−</button>
        <button id="zoomReset" class="btn btn-outline-light btn-sm">Reset view</button>
      </span>
    </div>

    <div id="inspector" class="d-none align-items-center gap-2 mb-2 small">
      <strong>Selected wall:</strong>
      <label>Length (cm) <input id="wallLen" type="number" step="any" min="5" style="width:90px" class="form-control form-control-sm d-inline-block" /></label>
      <label>Angle (°) <input id="wallAngle" type="number" step="any" style="width:80px" class="form-control form-control-sm d-inline-block" /></label>
      <label>Thickness (cm) <input id="wallThick" type="number" step="any" min="5" max="60" style="width:70px" class="form-control form-control-sm d-inline-block" /></label>
      <label>Fill <select id="wallFill" class="form-select form-select-sm d-inline-block" style="width:140px">
        <option value="solid">Opaque</option>
        <option value="dots">Dots</option>
        <option value="dash">Diagonal dashes</option>
      </select></label>
      <span class="text-muted">(length anchored at wall start, angle measured from +X axis)</span>
    </div>

    <div id="assetInspector" class="d-none align-items-center gap-2 mb-2 small">
      <strong>Selected <span id="assetType">asset</span>:</strong>
      <label>Width (cm) <input id="assetWidth" type="number" step="any" min="5" style="width:90px" class="form-control form-control-sm d-inline-block" /></label>
      <span class="text-muted">(drag to slide along the wall)</span>
    </div>

    <svg id="plan" style="width:100%; height:78vh; background:#111; border-radius:8px; touch-action:none;">
      <defs>
        <pattern id="patDots" width="7" height="7" patternUnits="userSpaceOnUse">
          <rect width="7" height="7" fill="rgba(224,224,224,0.14)" />
          <circle cx="3.5" cy="3.5" r="1.6" fill="#e0e0e0" />
        </pattern>
        <pattern id="patDash" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="rgba(224,224,224,0.14)" />
          <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#e0e0e0" stroke-width="1.4" />
        </pattern>
      </defs>
      <g id="world"></g>
      <g id="overlay"></g>
    </svg>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/db.js"></script>
  <script src="js/editor.js"></script>
  <script>
    (async () => {
      const path = new URLSearchParams(location.search).get('project');
      if (!path) { document.getElementById('title').textContent = 'No project specified.'; return; }
      const ok = await Storage.tryReconnect();
      if (!ok) { document.getElementById('title').textContent = 'No data folder connected — go back and pick one.'; return; }
      const p = await DB.open(path);
      document.getElementById('title').textContent = p.name;
      Editor.init(p, path);
    })();
  </script>
</body>
</html>
