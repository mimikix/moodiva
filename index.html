<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodiva — Floor Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-dark text-light">
  <main class="container py-5" style="max-width: 720px;">
    <h1 class="mb-4">🏠 Moodiva</h1>

    <div id="connectCard" class="card bg-secondary text-light mb-4">
      <div class="card-body">
        <h5 class="card-title">Data folder</h5>
        <p class="card-text small mb-2" id="folderStatus">No folder connected.</p>
        <button id="btnFolder" class="btn btn-primary me-2">Open data folder</button>
        <button id="btnBrowser" class="btn btn-outline-light">Use browser storage instead</button>
      </div>
    </div>

    <div id="projectsCard" class="card bg-secondary text-light d-none">
      <div class="card-body">
        <h5 class="card-title">Projects</h5>
        <ul id="projectList" class="list-group mb-3"></ul>
        <div class="input-group">
          <input id="newName" class="form-control" placeholder="New project name" />
          <button id="btnCreate" class="btn btn-success">Create</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/db.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let currentPath = null;

    async function refresh() {
      $('folderStatus').textContent = Storage.mode === 'folder'
        ? `Connected folder: ${Storage.folderName}`
        : Storage.mode === 'browser' ? 'Using in-browser storage (export manually to keep files).' : 'No folder connected.';
      $('btnFolder').textContent = Storage.mode ? 'Change data folder' : 'Open data folder';
      const connected = !!Storage.mode;
      $('projectsCard').classList.toggle('d-none', !connected);
      if (!connected) return;
      const list = await DB.list();
      $('projectList').innerHTML = list.length ? '' : '<li class="list-group-item bg-dark text-muted">No projects yet.</li>';
      for (const p of list) {
        const li = document.createElement('li');
        li.className = 'list-group-item bg-dark text-light d-flex justify-content-between align-items-center';
        li.innerHTML = `<a href="app.html?project=${encodeURIComponent(p.path)}" class="text-info text-decoration-none">${p.file}</a>` +
          `<button class="btn btn-sm btn-outline-danger" data-path="${p.path}">Delete</button>`;
        li.querySelector('button').onclick = async () => {
          if (confirm(`Delete ${p.file}?`)) { await DB.remove(p.path); refresh(); }
        };
        $('projectList').appendChild(li);
      }
    }

    $('btnFolder').onclick = async () => {
      try { await Storage.openFolder(); refresh(); } catch (e) { /* cancelled */ }
    };
    $('btnBrowser').onclick = async () => { Storage.useBrowserMode(); refresh(); };
    $('btnCreate').onclick = async () => {
      const name = $('newName').value.trim();
      if (!name) return;
      await DB.create(name);
      $('newName').value = '';
      refresh();
    };

    Storage.tryReconnect().then(refresh);
  </script>
</body>
</html>
